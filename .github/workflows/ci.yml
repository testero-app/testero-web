name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n message sync
        run: npm run check:i18n

      # src/types/api-generated.ts is generated from the committed openapi/openapi.json. A diff
      # here means the two were committed out of step — regenerate rather than hand-edit.
      - name: API types match the spec
        run: |
          npm run generate:api-types
          git diff --exit-code -- src/types/api-generated.ts || {
            echo "::error::src/types/api-generated.ts is stale — run npm run generate:api-types and commit it."
            exit 1
          }

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

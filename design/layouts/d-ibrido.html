<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testero - Layout D - Ibrido</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0ece4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Navbar --- */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: #1a1a1a;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border: 2.5px solid #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon::after {
      content: '';
      width: 10px;
      height: 10px;
      background-color: #3a6b35;
      border-radius: 50%;
    }

    /* --- Main Content --- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
    }

    .split-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      gap: 80px;
    }

    /* --- Hero Left --- */
    .hero-left {
      flex: 1;
      max-width: 400px;
    }

    .hero-left h1 {
      font-family: 'Inter', sans-serif;
      font-size: 46px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.12;
      margin-bottom: 16px;
    }

    .hero-left h1 em {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #3a6b35;
    }

    .hero-left p {
      font-size: 16px;
      color: #999;
      line-height: 1.6;
    }

    /* --- Card Right --- */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }

    /* --- Form --- */
    .field-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 8px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 0 16px;
      height: 52px;
      background: #fff;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: #3a6b35;
    }

    .input-wrapper svg {
      width: 20px;
      height: 20px;
      color: #aaa;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .input-wrapper input {
      border: none;
      outline: none;
      font-family: 'Courier New', monospace;
      font-size: 15px;
      color: #1a1a1a;
      width: 100%;
      background: transparent;
    }

    .input-wrapper input::placeholder {
      color: #bbb;
    }

    .btn-accedi {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      background-color: #3a6b35;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-accedi:hover {
      background-color: #2e5629;
    }

    .btn-accedi svg {
      width: 18px;
      height: 18px;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      main {
        padding: 40px 24px;
      }

      .split-container {
        flex-direction: column;
        gap: 36px;
      }

      .hero-left {
        text-align: center;
        max-width: 100%;
      }

      .hero-left h1 {
        font-size: 32px;
      }

      .hero-left p {
        font-size: 15px;
      }

      .card {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">
      <div class="logo-icon"></div>
      Testero
    </div>
  </nav>

  <!-- Main -->
  <main>
    <div class="split-container">

      <!-- Left: Hero -->
      <div class="hero-left">
        <h1>Challenge your<br><em>knowledge.</em></h1>
      </div>

      <!-- Right: Login card -->
      <div class="card">
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          <input type="text" placeholder="cognome.nome" />
        </div>

        <button class="btn-accedi">
          Accedi
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m12.75 15 3-3m0 0-3-3m3 3h-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </button>
      </div>

    </div>
  </main>

</body>
</html>
